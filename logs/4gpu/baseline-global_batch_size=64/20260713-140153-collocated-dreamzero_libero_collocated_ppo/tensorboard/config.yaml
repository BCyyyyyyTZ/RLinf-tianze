actor:
  model:
    model_type: dreamzero
    model_path: /data1/gaobowen/tianze/runtime_models/20260713-140153-collocated-dreamzero_libero_collocated_ppo/DreamZero-LIBERO-runtime
    tokenizer_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B/google/umt5-xxl
    diffusion_model_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B
    image_encoder_pretrained_path: /data1/gaobowen/tianze/model/Wan2.1-I2V-14B-480P/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
    text_encoder_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
    vae_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
    metadata_json_path: /data1/gaobowen/tianze/runtime_models/20260713-140153-collocated-dreamzero_libero_collocated_ppo/DreamZero-LIBERO-runtime/experiment_cfg/metadata.json
    action_dim: 32
    env_action_dim: 7
    state_horizon: 1
    action_horizon: 16
    num_action_per_block: 16
    max_action_dim: 32
    max_state_dim: 64
    target_video_height: 160
    target_video_width: 320
    action_head_cfg:
      _convert_: object
      _target_: groot.vla.model.dreamzero.action_head.wan_flow_matching_action_tf.WANPolicyHead
      config:
        _recursive_: false
        _target_: groot.vla.model.dreamzero.action_head.wan_flow_matching_action_tf.WANPolicyHeadConfig
        action_dim: 32
        action_horizon: 16
        skip_component_loading: true
        action_loss_embodiment_ids:
        - 26
        - 17
        add_pos_embed: true
        backbone_embedding_dim: 0
        backbone_features_projector_cfg: null
        decouple_inference_noise: false
        decouple_video_action_noise: false
        diffusion_model_cfg:
          _convert_: object
          _target_: groot.vla.model.dreamzero.modules.wan_video_dit_action_casual_chunk.CausalWanModel
          diffusion_model_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B
          dim: 3072
          eps: 1.0e-06
          ffn_dim: 14336
          frame_seqlen: 50
          freq_dim: 256
          in_dim: 48
          max_chunk_size: 4
          model_type: ti2v
          num_action_per_block: 16
          num_frame_per_block: 2
          num_heads: 24
          num_layers: 30
          num_state_per_block: 1
          out_dim: 48
          concat_first_frame_latent: false
        expand_batch: null
        freeze_decode_layer: false
        hidden_size: 64
        high_noise_beta_alpha: 3.0
        image_encoder_cfg:
          _convert_: object
          _target_: groot.vla.model.dreamzero.modules.wan_video_image_encoder.WanImageEncoder
          image_encoder_pretrained_path: /data1/gaobowen/tianze/model/Wan2.1-I2V-14B-480P/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
        init_lora_weights: kaiming
        input_embedding_dim: 1536
        load_pretrained_det_decode_layer_path: null
        lora_alpha: 4
        lora_rank: 4
        lora_target_modules: q,k,v,o,ffn.0,ffn.2
        max_action_dim: 32
        max_state_dim: 64
        model_dtype: float32
        noise_beta_alpha: 1.5
        noise_beta_beta: 1.0
        noise_s: 0.999
        num_frame_per_block: 2
        num_frames: 33
        num_inference_timesteps: 4
        num_timestep_buckets: 1000
        repa_coeff: 1.0
        repa_layer: 8
        text_encoder_cfg:
          _convert_: object
          _target_: groot.vla.model.dreamzero.modules.wan_video_text_encoder.WanTextEncoder
          text_encoder_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B/models_t5_umt5-xxl-enc-bf16.pth
        target_video_height: 160
        target_video_width: 320
        tile_size_height: 34
        tile_size_width: 34
        tile_stride_height: 18
        tile_stride_width: 16
        tiled: false
        train_architecture: lora
        tune_diffusion_model: true
        tune_projector: true
        use_gradient_checkpointing: true
        use_high_noise_emphasis: false
        use_vlln: true
        vae_cfg:
          _convert_: object
          _target_: groot.vla.model.dreamzero.modules.wan_video_vae.WanVideoVAE38
          vae_pretrained_path: /data1/gaobowen/tianze/model/Wan2.2-TI2V-5B/Wan2.2_VAE.pth
          z_dim: 48
          dim: 160
        video_inference_final_noise: 0.8
        video_noise_beta_alpha: 3.0
        video_noise_beta_beta: 1.0
        vl_self_attention_cfg:
          _target_: groot.vla.model.n1_5.modules.cross_attention_dit.SelfAttentionTransformer
          attention_head_dim: 64
          dropout: 0.2
          final_dropout: true
          num_attention_heads: 24
          num_layers: 4
          positional_embeddings: null
        defer_lora_injection: true
        debug_logging: false
    architectures:
    - VLA
    backbone_cfg:
      _target_: groot.vla.model.dreamzero.backbone.identity.IdentityBackbone
    num_action_chunks: 16
    embodiment_tag: libero_sim
    precision: bf16
    add_value_head: true
    add_q_head: false
    is_lora: true
    noise_method: flow_sde
    noise_level: 0.5
    safe_get_logprob: false
    joint_logprob: false
    num_steps: 10
    ppo_deterministic_eval: true
    gradient_checkpointing: false
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: bf16
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 64
  seed: 42
  enable_offload: false
  optim:
    lr: 1.0e-05
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-3
    env: 0-3
    rollout: 0-3
runner:
  task_type: embodied
  logger:
    log_path: /data1/gaobowen/tianze/logs/4gpu/20260713-140153-collocated-dreamzero_libero_collocated_ppo
    project_name: rlinf
    experiment_name: dreamzero_libero_collocated_ppo
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  per_worker_log: false
  per_worker_log_path: null
  nsight_output_path: null
  weight_sync_interval: 1
  overlap_env_bootstrap: false
