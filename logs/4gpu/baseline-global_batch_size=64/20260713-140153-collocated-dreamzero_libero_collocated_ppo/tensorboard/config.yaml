  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data1/gaobowen/tianze/runtime_models/20260713-140153-collocated-dreamzero_libero_collocated_ppo/DreamZero-LIBERO-runtime
    precision: bf16
